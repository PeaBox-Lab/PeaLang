name: Security Boundary
on: [push, pull_request]
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e . pytest coverage
      - run: coverage run --source=pealang.embedding,pealang.secure_packages,pealang.browser_profile,pealang.stdlib -m pytest tests/test_security_boundaries_v040.py -q
      - run: coverage report
