name: PeaLang 1.0 Security Scanners
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . bandit pip-audit
      - run: mkdir -p release-evidence/1.0/security && bandit -r pealang -f json -o release-evidence/1.0/security/bandit.json
      - run: pip-audit --format json --output release-evidence/1.0/security/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security
          path: release-evidence/1.0/security
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error .
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
