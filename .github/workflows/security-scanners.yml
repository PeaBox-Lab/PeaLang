name: Security Scanners
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  # CodeQL runs through GitHub's default setup for this repository. An
  # advanced-setup job (github/codeql-action/init + analyze) cannot upload
  # SARIF while default setup is enabled, so the workflow here only covers
  # the supply-chain audit. See security/CODEQL.md.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e .
      - run: pip-audit
