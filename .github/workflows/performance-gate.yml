name: Performance & Conformance Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest==9.2.0
      - run: python -m pealang.conformance
      - name: Upload Conformance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: conformance_report.json

  perf-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Save performance baseline
        run: python -m pealang.cli benchmark examples/hello.pea --save-baseline baseline.json --iterations 20
      - name: Check performance regression and write report
        run: python -m pealang.cli benchmark examples/hello.pea --baseline baseline.json --iterations 20 > perf_report.json
      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf_report.json
