name: Performance & Conformance Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pealang.conformance
      - name: Upload Conformance Report
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: conformance_report.json

  perf-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pealang.benchmark --save-baseline baseline.json --iterations 20
      - name: Upload Performance Report
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf_report.json
