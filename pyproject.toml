[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="pealang"
version="0.9.0"
description="A small language for big ideas"
readme="README.md"
requires-python=">=3.9"
license={text="MIT"}
authors=[{name="PeaBox Lab"}]
keywords=["language","interpreter","automation","education"]
[project.scripts]
pea="pealang.cli:main"
pealang="pealang.cli:main"
[tool.setuptools.packages.find]
include=["pealang*"]
