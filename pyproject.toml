[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pealang"
version = "0.13.0"
description = "A small readable automation and AI workflow language"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "PeaBox Labs"}]
[project.scripts]
pea = "pealang.cli:main"
pealang = "pealang.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
