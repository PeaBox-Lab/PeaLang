[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="pealang"
version="0.45.0"
description="Readable automation and AI workflow language"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["cryptography>=42"]
[project.scripts]
pea="pealang.cli:main"
pealang="pealang.cli:main"
[tool.pytest.ini_options]
testpaths=["tests"]

[tool.setuptools]
packages = ["pealang"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "pydantic>=2.0", "uvicorn>=0.27"]

